version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weathergpt-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weathergpt-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

  # Database and infrastructure stubs for Milestones 2+
  postgres:
    image: postgis/postgis:16-3.4
    container_name: weathergpt-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt_password
      POSTGRES_DB: weathergpt
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles: ["infra"]

  redis:
    image: redis:7-alpine
    container_name: weathergpt-redis
    ports:
      - "6379:6379"
    profiles: ["infra"]

volumes:
  pgdata:

